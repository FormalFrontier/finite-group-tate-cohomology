version: "v0.4"

project:
  name: Finite-group Tate cohomology
  description: >-
    Reusable Lean norms, exceptional Tate degrees, and objectwise additive
    cyclic period-two comparisons for finite-group representations.
  authors:
    - Formal Frontier Agents
  responsible_maintainers:
    - Formal Frontier source-maintainer team
  license: Apache-2.0

sources:
  - title: Classical finite-group Tate cohomology, norm and additive cyclic periodicity
    type: folklore
    relationship: independently-proves
    author_endorsement: n/a
    note: >-
      Standard mathematics, not a claim of completed correspondence with any
      specific selected source; the formalization reuses mathlib's Tate complex.
  - title: mathlib4 representation-theory Tate and finite-cyclic formal APIs
    id: https://github.com/leanprover-community/mathlib4/tree/83abb3e776bdefcbc447a1e44d0debe4010039e5/Mathlib/RepresentationTheory/Homological
    type: software
    relationship: background
    license: Apache-2.0
    author_endorsement: n/a
    note: >-
      Reused as a pinned dependency, not vendored here; upstream file headers
      credit their contributors, including Yunzhou Xie, Yaël Dillies and Amelia Livingston.

automation:
  methods:
    - method: agent
      framework: OpenAI Codex CLI with Lean verification
      tool_setup: Lean 4.34.0-rc2 and pinned mathlib4 with cache-first Lake builds
      prompting_notes: >-
        AI-assisted Formal Frontier agents and formalization workers contributed
        distinct mathematical modules, norm and NatIso component interfaces,
        checked examples, the original mixed-kind native catalogue and later
        documentation adaptations. The mathematical work was Lean-checked and
        independently reviewed; source-specific correspondence is separate.
  notes: >-
    Formal Frontier source maintainers retain mathematical acceptance and source
    correspondence responsibility; AI assistance alone establishes neither.

status:
  scope: >-
    Finite-group norm and exceptional degrees, quotient-equivariant norm for
    finite normal subgroups, fixed-element cyclic model coefficient functors,
    and objectwise all-integer additive cyclic period two with chosen generator.
    Native public API documentation is a historical source-byte reference, not
    certification of all private/generated proofs or selected-source coverage.
    No natural Tate comparison, generator independence, full resolution
    comparison, cup products, integral degree-two class, coefficient exact
    hexagon, cohomological triviality, local duality or NSW coverage is claimed.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - propext
    - Classical.choice
    - Quot.sound
  main_results:
    - declaration: FiniteGroupTateCohomology.normSequence_exact
      file: FiniteGroupTateCohomology/Basic.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
    - declaration: FiniteGroupTateCohomology.tateCohomologyNegOneNatIsoKernelNorm
      file: FiniteGroupTateCohomology/Basic.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
    - declaration: FiniteGroupTateCohomology.tateCohomologyZeroNatIsoCokernelNorm
      file: FiniteGroupTateCohomology/Basic.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
    - declaration: FiniteGroupTateCohomology.Cyclic.tateCohomologyPeriodicity
      file: FiniteGroupTateCohomology/CyclicPeriodicity.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]

fidelity:
  divergences: >-
    Norm supports independent universes; exceptional Tate comparisons use the
    pinned same-universe mathlib boundary. Cyclic model coefficient maps are
    natural for fixed elements, but comparison and periodicity isomorphisms are
    objectwise and require an explicit generator where indicated.

review:
  status: >-
    The mathematical development and checked-use clients underwent independent
    review on earlier pinned inputs; each release has separate exact-artifact
    acceptance. This metadata alone does not certify source-specific correspondence.
  reviewers:
    - Lattice
    - Formal Frontier agents
    - Formal Frontier independent norm-component reviewer
  notes: >-
    Earlier development review and later component review bind distinct inputs.
    Exact-artifact release approval and source-specific coverage remain separate
    decisions, not consequences of this catalogue or metadata.

acknowledgements: >-
  Formal Frontier source maintainers and formalization workers, mathlib4
  contributors and the Lean community are credited for their respective work.
