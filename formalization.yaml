    - Formal Frontier agents (development PRs 9 and 10)
  notes: >-
    PR12's independently reviewed bounded module migration, public examples
    and metadata are present on the accepted development main at 9882255fffc9960eb01497ae2edce43ccf877408;
    earlier reviews and PR12 do not cover these new generated native docs, the
    full raw/private/stored-body proof audit, entire-artifact rights clearance,
    first-release acceptance or source-specific correspondence. Later acceptance
    or publication is recorded externally, not inferred from this file.

